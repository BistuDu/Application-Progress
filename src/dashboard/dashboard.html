<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>投递进度表 · JD 投递追踪</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../../icons/icon48.png" alt="">
      <div>
        <h1>投递进度表</h1>
        <p id="brand-sub">—</p>
      </div>
    </div>
    <div class="search">
      <span class="si">🔍</span>
      <input id="q" type="search" placeholder="搜索公司、岗位、地点、技能、JD 内容…">
      <button class="clear" id="q-clear" hidden>✕</button>
    </div>
    <div class="top-actions">
      <button class="btn" id="btn-knowledge">面试知识库</button>
      <button class="btn" id="btn-add">＋ 手动添加</button>
      <div class="menu-wrap">
        <button class="btn" id="btn-export">导出 ▾</button>
        <div class="menu" id="export-menu" hidden>
          <button data-export="csv">导出 CSV（Excel 可开）</button>
          <button data-export="md">导出 Markdown（给 /offer 用）</button>
          <button data-export="json">导出 JSON 备份（含截图）</button>
          <button data-export="clip">复制 Markdown 到剪贴板</button>
        </div>
      </div>
      <button class="btn" id="btn-import">导入备份</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
      <button class="icon-btn" id="btn-options" title="设置">⚙</button>
    </div>
  </header>

  <section class="cards" id="cards"></section>

  <section class="panels">
    <div class="panel-card">
      <h2>投递漏斗 <span class="hint">累计走到过该阶段的岗位数，括号内为当前停留在该阶段的数量</span></h2>
      <div id="funnel" class="funnel"></div>
    </div>
    <div class="panel-card">
      <h2>近 8 周新增 <span class="hint">每周记录的岗位数</span></h2>
      <div id="trend" class="trend"></div>
    </div>
    <div class="panel-card">
      <h2>来源分布</h2>
      <div id="sites" class="bars"></div>
    </div>
    <div class="panel-card">
      <h2>高频技能关键词 <span class="hint">帮你找复习重点</span></h2>
      <div id="skills" class="chips"></div>
    </div>
  </section>

  <section class="filters">
    <div class="chips" id="status-filter"></div>
    <div class="filter-right">
      <select id="f-source"><option value="">全部来源</option></select>
      <select id="f-range">
        <option value="">全部时间</option>
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
        <option value="90">近 90 天</option>
        <option value="week">本周</option>
        <option value="month">本月</option>
      </select>
      <select id="f-sort">
        <option value="createdAt-desc">按记录时间 ↓</option>
        <option value="createdAt-asc">按记录时间 ↑</option>
        <option value="appliedAt-desc">按投递时间 ↓</option>
        <option value="appliedAt-asc">按投递时间 ↑</option>
        <option value="company-asc">按公司名</option>
        <option value="status-asc">按状态</option>
      </select>
      <label class="check"><input type="checkbox" id="f-todo"> 只看有下一步的</label>
      <span class="count" id="count"></span>
    </div>
  </section>

  <section class="table-wrap">
    <div class="batch" id="batch" hidden>
      <span id="batch-info"></span>
      <select id="batch-status"><option value="">批量改状态…</option></select>
      <button class="btn btn-danger" id="batch-delete">删除所选</button>
      <button class="btn btn-ghost" id="batch-clear">取消选择</button>
    </div>
    <table id="table">
      <thead>
        <tr>
          <th class="c-check"><input type="checkbox" id="check-all"></th>
          <th class="c-time">记录时间</th>
          <th>公司 / 岗位</th>
          <th class="c-loc">地点</th>
          <th class="c-salary">薪资</th>
          <th class="c-status">状态</th>
          <th class="c-applied">投递日期</th>
          <th class="c-source">来源</th>
          <th class="c-act"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>
      <div class="em-ico">📋</div>
      <h3>还没有记录</h3>
      <p>在招聘页面点扩展图标 → 「框选识别 JD」，截图里的岗位就会自动变成一条记录。</p>
    </div>
  </section>

  <!-- 详情抽屉 -->
  <aside class="drawer" id="drawer" hidden>
    <div class="d-head">
      <h2 id="d-title">详情</h2>
      <button class="icon-btn" id="d-close">✕</button>
    </div>
    <div class="d-body" id="d-body"></div>
    <div class="d-foot">
      <button class="btn btn-danger" id="d-delete">删除这条</button>
      <span class="grow"></span>
      <button class="btn btn-primary" id="d-save">保存修改</button>
    </div>
  </aside>

  <!-- 新增/手动录入 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <div class="m-head">
        <h2>手动添加记录</h2>
        <button class="icon-btn" id="m-close">✕</button>
      </div>
      <div class="m-body">
        <div class="grid">
          <label class="field full"><span>公司名称</span><input id="m-company" placeholder="字节跳动"></label>
          <label class="field full"><span>岗位名称</span><input id="m-title" placeholder="后端开发实习生"></label>
          <label class="field"><span>地点</span><input id="m-location" placeholder="北京"></label>
          <label class="field"><span>薪资</span><input id="m-salary" placeholder="300-400/天"></label>
          <label class="field"><span>状态</span><select id="m-status"></select></label>
          <label class="field"><span>投递日期</span><input id="m-applied" type="date"></label>
          <label class="field full"><span>下一步</span><input id="m-next" placeholder="9/20 前完成测评"></label>
          <label class="field full"><span>JD 正文</span><textarea id="m-jd" rows="4"></textarea></label>
          <label class="field full"><span>备注</span><textarea id="m-notes" rows="2"></textarea></label>
        </div>
      </div>
      <div class="m-foot">
        <button class="btn btn-ghost" id="m-cancel">取消</button>
        <button class="btn btn-primary" id="m-save">添加</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
